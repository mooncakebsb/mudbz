<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuDBZ - Season 6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100vh;
  background:#000 url('https://i.postimg.cc/P5JHVnSB/hollowyn.webp') no-repeat center center fixed;
  background-size:cover;
  font-family:'Segoe UI',Arial,sans-serif;
  display:flex;align-items:flex-end;justify-content:center
}
/* Sem overlay - sua marca 100% visível */

/* Container só pros botões, lá embaixo */
.container{
  position:relative;z-index:1;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding:0 16px 42px;
  min-height:100vh
}

/* BOTOES - EMBAIXO COMO NO SEU RISCO */
.botoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{
  padding:13px 32px;border-radius:10px;
  font-weight:800;text-decoration:none;text-transform:uppercase;
  letter-spacing:.5px;transition:.25s;font-size:13px;
  border:1px solid transparent;cursor:pointer
}
.btn-entrar{
  background:linear-gradient(90deg,#7c3aed,#a855f7);
  color:#fff;box-shadow:0 0 22px rgba(124,58,237,.8);
  border-color:#a78bfa
}
.btn-entrar:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 0 35px rgba(124,58,237,1)}
.btn-discord{
  background:rgba(0,0,0,.68);
  border-color:rgba(255,255,255,.25);
  color:#fff;backdrop-filter:blur(6px)
}
.btn-discord:hover{background:#5865f2;border-color:#5865f2;transform:translateY(-2px)}

@media(max-width:600px){
  body{background-attachment:scroll;background-position:center top}
  .container{padding-bottom:28px}
  .botoes{flex-direction:row;gap:10px}
  .btn{padding:11px 22px;font-size:11px}
}
</style>
</head>
<body>
<div class="container">
  <div class="botoes">
    <a href="https://pulse-bankbook-threefold.ngrok-free.dev/" class="btn btn-entrar">ENTRAR NO SITE</a>
    <a href="https://discord.gg/SUA-URL-AQUI" target="_blank" class="btn btn-discord">DISCORD</a>
  </div>
</div>
</body>
</html>

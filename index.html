<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuDBZ - Bem-vindo ao MuDbZ Season 6!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  /* SUA MARCA - SEM OFUSCAR */
  background:#000 url('https://i.postimg.cc/P5JHVnSB/hollowyn.webp') no-repeat center center fixed;
  background-size:cover;
  font-family:'Segoe UI',Arial,sans-serif;color:#fff;
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden
}
/* Overlay bem leve só pra dar contraste, não esconde a marca */
.overlay{position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.35));z-index:0}

.container{position:relative;z-index:1;width:94%;max-width:1000px;text-align:center;padding:20px 16px}

/* BLOCO MuDBZ + SEU MUNDO + HALLOWEEN JUNTOS */
.brand-group{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.logo{font-size:62px;font-weight:900;letter-spacing:2px;color:#e9d5ff;text-shadow:0 0 15px #a855f7, 0 0 35px #7c3aed, 2px 2px 0 #000}
.sub{letter-spacing:6px;color:#fff;margin-top:-6px;font-size:12px;font-weight:700;text-shadow:1px 1px 3px #000}
/* BARRA LARANJA - HALLOWEEN */
.halloween{
  margin:14px auto 0;
  color:#ffb86a;text-shadow:0 0 10px #ff8c00;
  font-weight:800;letter-spacing:2px;font-size:11px;
  border:1px solid #ff8c00;background:rgba(0,0,0,.55);
  display:inline-block;padding:7px 18px;border-radius:30px;
  box-shadow:0 0 15px rgba(255,140,0,.4);
  backdrop-filter:blur(3px)
}

/* BARRA ROXA - STATUS - DESCEU MAIS */
.status-box{
  margin:52px auto 0; /* DESCEU MAIS */
  background:rgba(8,8,18,.92);
  border:1px solid #7c3aed;border-radius:16px;
  padding:14px 18px;
  display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
  box-shadow:0 0 30px rgba(124,58,237,.6), 0 0 0 1px rgba(255,255,255,.08) inset;
}
.item small{display:block;color:#9ca3af;font-size:9px;letter-spacing:.8px;margin-bottom:2px}
.item b{font-size:14px}
.online{color:#22c55e} .roxo{color:#a78bfa} .laranja{color:#fb923c} .amarelo{color:#facc15}
.ponto{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;box-shadow:0 0 8px #22c55e;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

/* BOTOES - SÓ 2 */
.botoes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.btn{padding:13px 32px;border-radius:10px;font-weight:800;text-decoration:none;text-transform:uppercase;letter-spacing:.5px;transition:.25s;font-size:13px;border:1px solid transparent}
.btn-entrar{background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 0 22px rgba(124,58,237,.7);border-color:#a78bfa}
.btn-entrar:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 35px rgba(124,58,237,1)}
.btn-discord{background:rgba(88,101,242,.18);border-color:#5865f2;color:#fff;backdrop-filter:blur(4px)}
.btn-discord:hover{background:#5865f2;transform:translateY(-2px)}

.infos{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.infos span{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12);padding:5px 10px;border-radius:20px;font-size:10px;color:#cbd5e1}

/* RESPONSIVO */
@media(max-width:600px){
  .logo{font-size:42px}
  .sub{letter-spacing:3px;font-size:10px}
  .halloween{font-size:9px;padding:6px 12px;letter-spacing:1px}
  .status-box{gap:12px;padding:12px 10px;margin-top:38px}
  .item b{font-size:12px}
  .botoes{flex-direction:column;align-items:center}
  .btn{width:86%;max-width:280px}
}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="container">

  <!-- MuDBZ + SEU MUNDO + HALLOWEEN JUNTOS -->
  <div class="brand-group">
    <div class="logo">MuDBZ</div>
    <div class="sub">SEU MUNDO DE AVENTURAS</div>
    <div class="halloween">🎃 EVENTO HALLOWEEN ATIVO - DROP +50% E BOSS INVASÃO 20:00 🎃</div>
  </div>

  <!-- BARRA ROXA - DADOS REAIS DO SEU CONFIG.PHP - DESCEU MAIS -->

    <div class="item"><small>DROP</small><b class="amarelo">80%</b></div>
    <div class="item"><small>PLAYERS ON</small><b class="online" id="players">127</b></div>
    <div class="item"><small>RESET</small><b class="roxo">FREE</b></div>
  </div>

  <!-- APENAS 2 BOTOES -->
  <div class="botoes">
    <a href="https://pulse-bankbook-threefold.ngrok-free.dev/" class="btn btn-entrar">ENTRAR NO SITE</a>
    <!-- COLOQUE SUA URL DO DISCORD AQUI -->
    <a href="https://discord.gg/SUA-URL-AQUI" target="_blank" class="btn btn-discord">DISCORD</a>
  </div>

  <div class="infos">
    <span>⚔️ MuDbZ - BSB</span>
    <span>🕸️ Exp 1000x / Drop 80%</span>
    <span>👻 MuDbZ 2025</span>
  </div>

</div>

</body>
</html>

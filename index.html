<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuDBZ - Seu Mundo de Aventuras | Halloween</title>

<style>
/* ===== CONFIGURAÇÃO GERAL ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  /* Imagem de fundo - Halloween */
  background: #0a0a0f url('bg-halloween.jpg') no-repeat center center fixed;
  background-size: cover; /* Cobre a tela toda */
  font-family: 'Segoe UI', Arial, sans-serif;
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}
/* Escurece o fundo pra destacar o conteúdo */
body::before {
  content: "";
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); /* 60% escuro */
  z-index: -1;
}

/* ===== CONTAINER CENTRAL ===== */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 20px;
  text-align: center;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* Logo já está na imagem, mas vamos fazer um brilho extra */
.glow-text {
  font-size: 18px;
  color: #ff8c00;
  text-shadow: 0 0 15px #ff8c00;
  letter-spacing: 3px;
  margin-bottom: 10px;
  animation: pisca 2s infinite;
}
@keyframes pisca { 0%, 100% { opacity: 1 } 50% { opacity: 0.6 } }

/* ===== STATUS DO SERVIDOR ===== */
/* Caixa com status - EDITE AQUI SUAS INFOS */
.status-box {
  background: rgba(15,15,25,0.85);
  border: 1px solid #8a2be2; /* Roxo do MuDBZ */
  border-radius: 15px;
  padding: 20px 30px;
  margin: 30px 0;
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
  justify-content: center;
  box-shadow: 0 0 30px rgba(138,43,226,0.4);
  backdrop-filter: blur(5px); /* Efeito vidro */
}
.status-item { text-align: center; }
.status-item span { display: block; font-size: 12px; color: #aaa; }
.status-item strong { font-size: 18px; color: #00ff88; }
.status-item strong.off { color: #ff4444; } /* Se ficar offline */
.ponto-online {
  width: 10px; height: 10px; background: #00ff88;
  border-radius: 50%; display: inline-block;
  box-shadow: 0 0 10px #00ff88;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0% { transform: scale(1) } 50% { transform: scale(1.3) } }

/* ===== BOTÕES NO MESMO NÍVEL ===== */
/* Aqui ficam todos os botões alinhados */
.botoes {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 20px;
}
/* Estilo padrão dos botões */
.btn {
  padding: 15px 35px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: 0.3s;
  border: 2px solid transparent;
  cursor: pointer;
}
/* Botão ENTRAR - Principal */
.btn-entrar {
  background: linear-gradient(90deg, #8a2be2, #a855f7);
  color: white;
  box-shadow: 0 0 20px rgba(138,43,226,0.6);
}
.btn-entrar:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(138,43,226,0.9); }
/* Botão secundário */
.btn-sec {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.3);
  color: white;
}
.btn-sec:hover { background: rgba(255,255,255,0.2); border-color: #ff8c00; color: #ff8c00; }

/* ===== RODAPÉ COM INFOS EDITÁVEIS ===== */
.infos {
  margin-top: 40px;
  font-size: 13px;
  color: #ccc;
  display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
}
.infos span { background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 20px; border: 1px solid #333; }
</style>
</head>

<body>
<div class="container">

  <div class="glow-text">🎃 EVENTO HALLOWEEN ATIVO - DROP DOBRADO 🎃</div>

  <!-- STATUS - EDITE AQUI -->
  <div class="status-box">
    <div class="status-item">
      <span><span class="ponto-online"></span> STATUS</span>
      <strong>ONLINE</strong>
    </div>
    <div class="status-item">
      <span>VERSÃO</span>
      <strong style="color:#a855f7">SEASON 6 EP3</strong>
    </div>
    <div class="status-item">
      <span>EXP</span>
      <strong style="color:#ff8c00">1000x</strong>
    </div>
    <div class="status-item">
      <span>PLAYERS ON</span>
      <strong id="players">127</strong>
    </div>
    <div class="status-item">
      <span>DROP</span>
      <strong style="color:#ff8c00">80% + HALLOWEEN</strong>
    </div>
  </div>

  <!-- BOTÕES - TODOS NO MESMO NÍVEL -->
  <div class="botoes">
    <!-- ESSE É O BOTÃO QUE LEVA PRO SEU SITE PRINCIPAL -->
    <a href="https://pulse-bankbook-threefold.ngrok-free.dev" class="btn btn-entrar">ENTRAR NO JOGO</a>
    
    <a href="https://pulse-bankbook-threefold.ngrok-free.dev/download" class="btn btn-sec">Download</a>
    
    <a href="https://discord.gg/seu-discord" class="btn btn-sec">Discord</a>
    
    <a href="https://pulse-bankbook-threefold.ngrok-free.dev/cadastro" class="btn btn-sec">Cadastro</a>
  </div>

  <div class="infos">
    <span>🕸️ Experiência: 1000x</span>
    <span>🎃 Drop Halloween: +50%</span>
    <span>💀 Boss Invasão: 20:00</span>
    <span>👻 MuDBZ BSB</span>
  </div>

</div>

<script>
// Script simples pra número de players variar - fica mais real
let base = 127;
setInterval(() => {
  let variação = Math.floor(Math.random() * 7) - 3; // -3 a +3
  document.getElementById('players').innerText = base + variação;
}, 4000);
</script>

</body>
</html>
